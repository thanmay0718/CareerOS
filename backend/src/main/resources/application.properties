# =====================================
# Application Configuration
# =====================================
spring.application.name=careeros-backend

# =====================================
# PostgreSQL Database Configuration
# =====================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careeros}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================
# JPA / Hibernate
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =====================================
# HikariCP
# =====================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# =====================================
# Server
# =====================================
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024

# =====================================
# MVC
# =====================================
spring.mvc.problemdetails.enabled=true

# =====================================
# Logging
# =====================================
logging.level.root=INFO
logging.level.com.careeros=INFO
logging.level.org.springframework.security=INFO

# =====================================
# JWT
# =====================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=900000

# =====================================
# CORS
# =====================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =====================================
# Swagger
# =====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html