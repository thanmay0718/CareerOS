# =====================================
# Application Configuration
# =====================================
spring.application.name=careeros-backend

# =====================================
# PostgreSQL Database Configuration
# =====================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/careeros}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================
# JPA / Hibernate
# =====================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =====================================
# HikariCP
# =====================================
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# =====================================
# Server
# =====================================
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024

# =====================================
# MVC
# =====================================
spring.mvc.problemdetails.enabled=true

# =====================================
# Logging
# =====================================
logging.level.root=INFO
logging.level.com.careeros=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO

# =====================================
# Performance Timing
# =====================================
app.performance.request-threshold-ms=100
app.performance.auth-threshold-ms=25
app.performance.controller-threshold-ms=100
app.performance.service-threshold-ms=100
app.performance.repository-threshold-ms=50
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=100

# =====================================
# JWT
# =====================================
app.security.jwt.secret=${JWT_SECRET:careeros-development-secret-key-change-before-production-2026}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# =====================================
# CORS
# =====================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =====================================
# Swagger
# =====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
